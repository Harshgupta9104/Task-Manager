name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      # Required by the junit-report step to publish failure annotations.
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backend tests
        # --junitxml: machine-readable results, re-emitted as check-run
        # annotations below so the failing test names appear in the UI even
        # when the raw log cannot be viewed.
        run: pytest tests/ -v --junitxml=pytest-results.xml

      - name: Annotate test failures
        if: failure()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: pytest-results.xml
          check_name: backend tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Vite 8 / Vitest 5 require Node >= 20.19; 22 is the current LTS.
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run frontend lint
        run: npm run lint
        working-directory: frontend

      - name: Run frontend build
        run: npm run build
        working-directory: frontend

      - name: Run frontend tests
        run: npm test
        working-directory: frontend
