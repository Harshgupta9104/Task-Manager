[project]
name = "task-manager-backend"
version = "1.0.0"
description = "FastAPI task management backend"
requires-python = ">=3.10"

# ─── Ruff (lint + format) ────────────────────────────────────────────
# Scope: app/ and tests/. Baseline: correctness + imports, no aggressive
# stylistic rules. Formatting is enforced via `ruff format --check`.
# Configuration docs: https://docs.astral.sh/ruff/configuration/
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["frontend", "venv"]

[tool.ruff.lint]
# E  = pycodestyle errors (correctness-ish: E711/E712 comparisons, E722 bare except, ...)
# F  = pyflakes (undefined names, unused imports/variables, f-string issues)
# I  = isort (import ordering)
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
# Formatter defaults (double quotes, 100-col line length via [tool.ruff]).
quote-style = "double"
indent-style = "space"

# ─── mypy (gradual typing) ──────────────────────────────────────────
# Philosophy: catch real type errors now, tighten later. Only settings the
# codebase satisfies cleanly (verified) — no blanket ignores.
[tool.mypy]
python_version = "3.10"
files = ["app"]
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unreachable = true
